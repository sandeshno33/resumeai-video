name: Render Marketing Videos

# Triggers:
#   - Push to main when compositions or assets change
#   - Manual dispatch with quality knobs (Actions → Render Marketing Videos → Run workflow)
on:
  # Auto-trigger when actual content changes — but NOT when the workflow
  # file itself is edited (those edits shouldn't burn 30+ runner-minutes).
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'compositions/**'
      - 'assets/**'
      - 'package.json'
  workflow_dispatch:
    inputs:
      scene:
        description: 'What to render: the full orchestrated video, all scenes individually, or one scene'
        required: false
        default: 'full'
        type: choice
        options:
          - 'full'
          - 'all-scenes'
          - 'hook'
          - 'brand-reveal'
          - 'dashboard'
          - 'job-preferences'
          - 'ats-optimizer'
          - 'recommended-jobs'
          - 'job-applications'
          - 'stats-payoff'
          - 'cta'
      resolution:
        description: 'Resolution preset (landscape = 1080p, landscape-4k = 2160p)'
        required: false
        default: 'landscape'
        type: choice
        options:
          - 'landscape'
          - 'landscape-4k'
      fps:
        description: 'Frame rate (24, 30, 60)'
        required: false
        default: '60'
      crf:
        description: 'CRF (lower = higher quality. 14 = near-lossless, 18 = high preset default, 23 = standard)'
        required: false
        default: '14'

# Cancel in-progress renders on the same ref when a new commit lands
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tiny prerequisite job: emit the matrix as JSON, filtered by the
  # user-picked scene if workflow_dispatch was used with one. Job-level
  # `if:` can't reference `matrix` (matrix expands after `if` evaluates),
  # so this is the canonical "dynamic matrix" pattern.
  configure:
    name: Configure scene matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix JSON
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          SCENE: ${{ github.event.inputs.scene }}
        run: |
          # index.html is the full orchestrated video (9 scenes + wipes + VO).
          full='[
            {"name":"full-video","file":"index.html"}
          ]'
          scenes='[
            {"name":"hook","file":"compositions/hook.html"},
            {"name":"brand-reveal","file":"compositions/brand-reveal.html"},
            {"name":"dashboard","file":"compositions/dashboard.html"},
            {"name":"job-preferences","file":"compositions/job-preferences.html"},
            {"name":"ats-optimizer","file":"compositions/ats-optimizer.html"},
            {"name":"recommended-jobs","file":"compositions/recommended-jobs.html"},
            {"name":"job-applications","file":"compositions/job-applications.html"},
            {"name":"stats-payoff","file":"compositions/stats-payoff.html"},
            {"name":"cta","file":"compositions/cta.html"}
          ]'
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$SCENE" = "all-scenes" ]; then
            filtered=$(echo "$scenes" | jq -c '.')
          elif [ "$EVENT" = "workflow_dispatch" ] && [ -n "$SCENE" ] && [ "$SCENE" != "full" ]; then
            filtered=$(echo "$scenes" | jq -c --arg s "$SCENE" '[.[] | select(.name == $s)]')
          else
            # Push to main (and dispatch with 'full') renders the whole video.
            filtered=$(echo "$full" | jq -c '.')
          fi
          echo "Scene matrix: $filtered"
          echo "matrix={\"scene\":$filtered}" >> "$GITHUB_OUTPUT"

  render:
    name: Render ${{ matrix.scene.name }}
    needs: configure
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      # Render selected scenes in parallel. fail-fast: false so one
      # broken scene doesn't kill the others — useful for debugging.
      fail-fast: false
      matrix: ${{ fromJson(needs.configure.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Hyperframes drives headless Chrome + FFmpeg. The runner image has
      # neither preinstalled with all deps — pull them in explicitly.
      # Ubuntu 24.04 renamed several libs as part of the t64 transition
      # (libasound2 → libasound2t64). Use the new names.
      - name: Install FFmpeg + Chrome system deps
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
          NEEDRESTART_SUSPEND: 1
        run: |
          set -e
          # Retry apt-get up to 3× to ride out flaky Azure mirrors.
          # We saw 10-min hangs while libavfilter9 (~4MB) was streaming.
          retry() {
            local n=0
            local max=3
            until "$@"; do
              n=$((n+1))
              if [ "$n" -ge "$max" ]; then
                echo "Command failed after $max attempts: $*" >&2
                return 1
              fi
              echo "Attempt $n failed; retrying in 5s..." >&2
              sleep 5
            done
          }
          retry sudo apt-get update -qq
          retry sudo apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            ffmpeg \
            libnss3 libatk-bridge2.0-0t64 libatk1.0-0t64 libcups2t64 libdrm2 libgbm1 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libxfixes3 \
            libxext6 libxrender1 libpango-1.0-0 libpangocairo-1.0-0 \
            libasound2t64 libatspi2.0-0t64 fonts-liberation libcairo2 libcurl4t64 \
            libdbus-1-3 libexpat1 libfontconfig1 libnspr4 libwayland-client0
          ffmpeg -version | head -1
          node --version

      # The voiceover track is generated, not committed. Kokoro is
      # deterministic (same model + voice + text → same audio), so CI
      # output matches the local clips the timings were measured against.
      - name: Setup Python for TTS
        if: matrix.scene.name == 'full-video'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate voiceover (Kokoro TTS)
        if: matrix.scene.name == 'full-video'
        timeout-minutes: 10
        run: |
          pip install --quiet kokoro-onnx soundfile
          bash scripts/generate-vo.sh
          ls -lh assets/vo/

      - name: Render ${{ matrix.scene.name }}
        env:
          RES: ${{ github.event.inputs.resolution || 'landscape' }}
          FPS: ${{ github.event.inputs.fps || '60' }}
          CRF: ${{ github.event.inputs.crf || '14' }}
        run: |
          mkdir -p renders
          OUT="renders/${{ matrix.scene.name }}-${RES}-${FPS}fps-crf${CRF}.mp4"
          echo "Rendering ${{ matrix.scene.file }} → $OUT"
          npx --yes hyperframes@0.6.91 render \
            -c "${{ matrix.scene.file }}" \
            -q high \
            -f "$FPS" \
            --resolution "$RES" \
            --crf "$CRF" \
            -o "$OUT"
          ls -lh "$OUT"

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scene.name }}
          path: renders/${{ matrix.scene.name }}-*.mp4
          retention-days: 30
          if-no-files-found: error
          compression-level: 0  # MP4 is already compressed; skip zip overhead

  # Convenience: aggregate all 4 MP4s into one downloadable bundle.
  bundle:
    name: Bundle all renders
    needs: render
    runs-on: ubuntu-latest
    if: always() && needs.render.result == 'success'
    steps:
      - name: Download all scene artifacts
        uses: actions/download-artifact@v4
        with:
          path: renders/
          merge-multiple: true

      - name: List bundle
        run: ls -lh renders/

      - name: Upload combined bundle
        uses: actions/upload-artifact@v4
        with:
          name: all-renders-bundle
          path: renders/*.mp4
          retention-days: 90
          compression-level: 0
