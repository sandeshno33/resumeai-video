<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Resume AI — Pain Hook</title>
  <link rel="stylesheet" href="/compositions/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="/compositions/motion.js"></script>
  <style>
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #061b31; }
    .stage {
      position: relative; width: 1920px; height: 1080px;
      background: #061b31; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 28px;
      font-family: "Inter", sans-serif;
    }
    .glow { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
    .glow-a { top: -220px; right: -160px; width: 640px; height: 640px; background: rgba(83, 58, 253, 0.22); }
    .glow-b { bottom: -260px; left: -180px; width: 720px; height: 720px; background: rgba(46, 43, 140, 0.35); }

    .line { position: relative; font-size: 76px; font-weight: 300; letter-spacing: -1.5px; color: #ffffff; line-height: 1.15; }
    .line .word { display: inline-block; will-change: transform, opacity; }
    .line .dim { color: rgba(255, 255, 255, 0.55); }
    .line .hot { color: #ea2261; font-weight: 400; }
  </style>
</head>
<body>
  <div class="stage" data-layout-allow-overflow data-composition-id="hook" data-width="1920" data-height="1080" data-duration="3">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="line" id="line-1">
      <span class="word dim">You</span> <span class="word dim">apply</span> <span class="word dim">to</span>
      <span class="word">a</span> <span class="word">hundred</span> <span class="word">jobs.</span>
    </div>
    <div class="line" id="line-2">
      <span class="word dim">You</span> <span class="word dim">hear</span> <span class="word dim">back</span>
      <span class="word dim">from</span> <span class="word hot" id="three">three.</span>
    </div>
  </div>

  <script>
    var m = window.__motion;

    gsap.set("#line-1 .word", { opacity: 0, y: 34 });
    gsap.set("#line-2 .word", { opacity: 0, y: 34 });

    var tl = gsap.timeline({ paused: true });

    // ─── 0.25s — line 1 rises word by word ────────────────────────────
    tl.to("#line-1 .word", {
      opacity: 1, y: 0,
      duration: m.hero, ease: m.smoothOut,
      stagger: 0.045,
    }, 0.15);

    // ─── 1.70s — line 2, with "three." landing hard ───────────────────
    tl.to("#line-2 .word", {
      opacity: 1, y: 0,
      duration: m.hero, ease: m.smoothOut,
      stagger: 0.055,
    }, 1.00);

    tl.fromTo("#three",
      { scale: 1.45 },
      { scale: 1.0, duration: 0.45, ease: m.springPop, transformOrigin: "50% 50%" },
      1.32);

    // ─── 2.9s — slow camera push while the line sinks in ──────────────
    tl.to(".stage", { scale: 1.03, duration: 1.3, ease: m.smoothInOut, transformOrigin: "50% 50%" }, 1.60);

    // ─── 3.95s — lines exit up, glows remain (brand scene continues bg)
    tl.to("#line-1, #line-2", {
      opacity: 0, y: -26,
      duration: 0.35, ease: "power2.in",
      stagger: 0.05,
    }, 2.55);

    window.__timelines = window.__timelines || {};
    window.__timelines["hook"] = tl;
  </script>
</body>
</html>
