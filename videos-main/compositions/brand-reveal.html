<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Resume AI — Brand Reveal</title>
  <link rel="stylesheet" href="/compositions/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="/compositions/motion.js"></script>
  <style>
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #061b31; }
    .stage {
      position: relative; width: 1920px; height: 1080px;
      background: #061b31; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 30px;
      font-family: "Inter", sans-serif;
    }
    .glow { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
    .glow-a { top: -220px; right: -160px; width: 640px; height: 640px; background: rgba(83, 58, 253, 0.22); }
    .glow-b { bottom: -260px; left: -180px; width: 720px; height: 720px; background: rgba(46, 43, 140, 0.35); }
    .logo-halo {
      position: absolute; top: 50%; left: 50%; width: 860px; height: 860px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(83, 58, 253, 0.30) 0%, rgba(83, 58, 253, 0) 62%);
      pointer-events: none;
    }
    .logo { position: relative; width: 640px; will-change: transform, opacity; }
    .tagline {
      position: relative; font-size: 30px; font-weight: 300; letter-spacing: -0.3px;
      color: rgba(255, 255, 255, 0.62);
    }
    .tagline .accent { color: #b9b9f9; font-weight: 400; }
  </style>
</head>
<body>
  <div class="stage" data-layout-allow-overflow data-composition-id="brand-reveal" data-width="1920" data-height="1080" data-duration="2.6">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="logo-halo" id="halo"></div>
    <img class="logo" id="logo" src="/assets/resumeai_logo.webp" alt="Resume AI">
    <div class="tagline" id="tagline">Your job search, <span class="accent">on autopilot.</span></div>
  </div>

  <script>
    var m = window.__motion;

    gsap.set("#logo",    { opacity: 0, scale: 0.82, y: 14 });
    gsap.set("#halo",    { opacity: 0, scale: 0.6 });
    gsap.set("#tagline", { opacity: 0, y: 18 });

    var tl = gsap.timeline({ paused: true });

    // ─── 0.20s — logo lands with halo bloom ───────────────────────────
    tl.to("#logo", { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: m.springBrisk }, 0.10);
    tl.to("#halo", { opacity: 1, scale: 1, duration: 0.9, ease: m.settle }, 0.15);

    // ─── 1.30s — tagline ───────────────────────────────────────────────
    tl.to("#tagline", { opacity: 1, y: 0, duration: m.ui, ease: m.smoothOut }, 0.85);

    // ─── 1.9s — slow push until the wipe takes over ────────────────────
    tl.to(".stage", { scale: 1.03, duration: 1.4, ease: m.smoothInOut, transformOrigin: "50% 50%" }, 1.20);

    window.__timelines = window.__timelines || {};
    window.__timelines["brand-reveal"] = tl;
  </script>
</body>
</html>
