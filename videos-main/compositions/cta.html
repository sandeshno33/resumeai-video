<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Resume AI — CTA</title>
  <link rel="stylesheet" href="/compositions/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="/compositions/motion.js"></script>
  <style>
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #061b31; }
    .stage {
      position: relative; width: 1920px; height: 1080px;
      background: #061b31; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 44px;
      font-family: "Inter", sans-serif;
    }
    .glow { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
    .glow-a { top: -220px; right: -160px; width: 640px; height: 640px; background: rgba(83, 58, 253, 0.22); }
    .glow-b { bottom: -260px; left: -180px; width: 720px; height: 720px; background: rgba(46, 43, 140, 0.35); }
    .logo-halo {
      position: absolute; top: 44%; left: 50%; width: 760px; height: 760px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(83, 58, 253, 0.28) 0%, rgba(83, 58, 253, 0) 62%);
      pointer-events: none;
    }
    .logo { position: relative; width: 540px; will-change: transform, opacity; }
    .cta-btn {
      position: relative;
      display: inline-flex; align-items: center; gap: 12px;
      padding: 22px 52px; border-radius: 8px;
      background: #533afd; color: #ffffff;
      font-size: 28px; font-weight: 400; letter-spacing: -0.2px;
      box-shadow: 0 18px 50px rgba(83, 58, 253, 0.45);
      will-change: transform, opacity;
    }
    .cta-hint { position: relative; font-size: 17px; font-weight: 300; color: rgba(255, 255, 255, 0.45); }
    .fade-out {
      position: absolute; inset: 0; background: #061b31;
      opacity: 0; pointer-events: none; z-index: 10;
    }
  </style>
</head>
<body>
  <div class="stage" data-layout-allow-overflow data-composition-id="cta" data-width="1920" data-height="1080" data-duration="5">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="logo-halo" id="halo"></div>
    <img class="logo" id="logo" src="/assets/resumeai_logo.webp" alt="Resume AI">
    <div class="cta-btn" id="cta-btn">Start free</div>
    <div class="cta-hint" id="cta-hint">No credit card required</div>
    <div class="fade-out" id="fade-out"></div>
  </div>

  <script>
    var m = window.__motion;

    gsap.set("#logo",     { opacity: 0, scale: 0.86, y: 12 });
    gsap.set("#halo",     { opacity: 0, scale: 0.6 });
    gsap.set("#cta-btn",  { opacity: 0, y: 26, scale: 0.92 });
    gsap.set("#cta-hint", { opacity: 0, y: 14 });

    var tl = gsap.timeline({ paused: true });

    // ─── 0.25s — logo returns ──────────────────────────────────────────
    tl.to("#logo", { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: m.springBrisk }, 0.15);
    tl.to("#halo", { opacity: 1, scale: 1, duration: 1.0, ease: m.settle }, 0.20);

    // ─── 1.15s — CTA button pops ───────────────────────────────────────
    tl.to("#cta-btn", { opacity: 1, y: 0, scale: 1, duration: m.uiSlow, ease: m.springLively }, 0.85);
    tl.to("#cta-hint", { opacity: 1, y: 0, duration: m.ui, ease: m.smoothOut }, 1.15);

    // ─── 2.6s — emphasis pulse on the button ───────────────────────────
    tl.to("#cta-btn", {
      keyframes: [
        { scale: 1.05, duration: 0.20, ease: m.springLively },
        { scale: 1.00, duration: 0.30, ease: m.smoothOut },
      ],
      transformOrigin: "50% 50%",
    }, 2.00);

    // ─── 3.2s — settle push, then fade to navy for a clean end ─────────
    tl.to(".stage", { scale: 1.025, duration: 1.8, ease: m.smoothInOut, transformOrigin: "50% 50%" }, 2.60);
    tl.to("#fade-out", { opacity: 1, duration: 0.6, ease: "power2.in" }, 4.35);

    window.__timelines = window.__timelines || {};
    window.__timelines["cta"] = tl;
  </script>
</body>
</html>
