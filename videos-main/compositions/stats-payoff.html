<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Resume AI — Payoff Stats</title>
  <link rel="stylesheet" href="/compositions/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/TextPlugin.min.js"></script>
  <script src="/compositions/motion.js"></script>
  <style>
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #061b31; }
    .stage {
      position: relative; width: 1920px; height: 1080px;
      background: #061b31; overflow: hidden;
      display: flex; align-items: center; justify-content: center; gap: 120px;
      font-family: "Inter", sans-serif;
    }
    .glow { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
    .glow-a { top: -220px; right: -160px; width: 640px; height: 640px; background: rgba(83, 58, 253, 0.22); }
    .glow-b { bottom: -260px; left: -180px; width: 720px; height: 720px; background: rgba(46, 43, 140, 0.35); }

    .stat { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; will-change: transform, opacity; }
    .stat-num {
      font-size: 190px; font-weight: 200; letter-spacing: -5px; line-height: 1;
      color: #ffffff; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" on;
      display: inline-block;
    }
    .stat-num.accent { color: #f96bee; }
    .stat-rule { width: 64px; height: 2px; background: #533afd; transform-origin: 50% 50%; }
    .stat-label {
      font-size: 17px; font-weight: 400; letter-spacing: 2.4px; text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55); text-align: center; line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="stage" data-layout-allow-overflow data-composition-id="stats-payoff" data-width="1920" data-height="1080" data-duration="5.5">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>

    <div class="stat" id="stat-1">
      <span class="stat-num" id="num-1">0</span>
      <div class="stat-rule"></div>
      <div class="stat-label">Applications<br>a week</div>
    </div>

    <div class="stat" id="stat-2">
      <span class="stat-num accent" id="num-2">0</span>
      <div class="stat-rule"></div>
      <div class="stat-label">Interviews<br>this month</div>
    </div>

    <div class="stat" id="stat-3">
      <span class="stat-num" id="num-3">12</span>
      <div class="stat-rule"></div>
      <div class="stat-label">Hours<br>lost</div>
    </div>
  </div>

  <script>
    var m = window.__motion;
    if (window.TextPlugin) gsap.registerPlugin(TextPlugin);

    gsap.set(".stat", { opacity: 0, y: 44 });
    gsap.set(".stat-rule", { scaleX: 0 });

    var tl = gsap.timeline({ paused: true });

    // Deterministic counter: discrete tl.set(text) ticks survive seeking.
    function counterTicks(targetSel, from, to, startTime, duration, steps) {
      steps = steps || 10;
      function powerOut(t) { return 1 - Math.pow(1 - t, 4); }
      for (var i = 0; i <= steps; i++) {
        var p = i / steps;
        var v = Math.round(from + (to - from) * powerOut(p));
        tl.set(targetSel, { text: String(v) }, startTime + (duration * p));
      }
    }

    // ─── Tiles rise in, one beat apart ─────────────────────────────────
    tl.to("#stat-1", { opacity: 1, y: 0, duration: m.uiSlow, ease: m.springBrisk }, 0.20);
    tl.to("#stat-2", { opacity: 1, y: 0, duration: m.uiSlow, ease: m.springBrisk }, 1.15);
    tl.to("#stat-3", { opacity: 1, y: 0, duration: m.uiSlow, ease: m.springBrisk }, 2.10);
    tl.to(".stat-rule", { scaleX: 1, duration: m.ui, ease: m.smoothOut, stagger: 0.95 }, 0.40);

    // ─── Counters land with their tiles ────────────────────────────────
    counterTicks("#num-1",  0, 47, 0.35, 1.00, 16);
    counterTicks("#num-2",  0,  6, 1.30, 0.65, 6);
    counterTicks("#num-3", 12,  0, 2.25, 0.70, 12);

    // Pop each number as it settles
    [["#num-1", 1.45], ["#num-2", 2.05], ["#num-3", 3.05]].forEach(function (pair) {
      tl.to(pair[0], {
        keyframes: [
          { scale: 1.10, duration: 0.18, ease: m.springLively },
          { scale: 1.00, duration: 0.22, ease: m.smoothOut },
        ],
        transformOrigin: "50% 50%",
      }, pair[1]);
    });

    // ─── 4.6s — camera push to close the beat ─────────────────────────
    tl.to(".stage", { scale: 1.03, duration: 1.9, ease: m.smoothInOut, transformOrigin: "50% 50%" }, 3.40);

    window.__timelines = window.__timelines || {};
    window.__timelines["stats-payoff"] = tl;
  </script>
</body>
</html>
