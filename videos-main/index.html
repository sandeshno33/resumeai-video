<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Resume AI — Marketing Video</title>

  <link rel="stylesheet" href="compositions/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="compositions/motion.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #061b31;
    }
    #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
    .scene { position: absolute; inset: 0; }

    /* ─── Transition wipes: skewed panels sweeping left → right ─────── */
    .wipe { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .wp {
      position: absolute; top: -10%; left: -15%;
      width: 130%; height: 120%;
      transform: skewX(-12deg);
      will-change: transform;
    }
    .wp-back  { background: #1c1e54; }
    .wp-front { background: linear-gradient(135deg, #533afd 0%, #2e2b8c 100%); }
    .wipe-label {
      position: absolute; inset: 0;
      transform: skewX(12deg);
      display: flex; align-items: center; justify-content: center; gap: 20px;
      font-family: "Inter", sans-serif;
      color: #ffffff;
    }
    .wipe-label .no { font-size: 30px; font-weight: 400; letter-spacing: 4px; color: #b9b9f9; }
    .wipe-label .name { font-size: 64px; font-weight: 200; letter-spacing: -1.2px; }
  </style>
</head>
<body>
  <!-- Root composition: 9 scenes, transition wipes (track 3), voiceover (track 6). -->
  <div id="root"
       data-composition-id="main"
       data-start="0"
       data-duration="58.2"
       data-width="1920"
       data-height="1080">

    <!-- ─── Scenes (track 0) ──────────────────────────────────────────── -->
    <div class="scene clip" data-composition-id="sc-hook"          data-composition-src="compositions/hook.html"             data-start="0"    data-duration="3" data-track-index="0"></div>
    <div class="scene clip" data-composition-id="sc-brand"         data-composition-src="compositions/brand-reveal.html"     data-start="3"  data-duration="2.6"   data-track-index="0"></div>
    <div class="scene clip" id="sc-dashboard" data-composition-id="sc-dashboard"     data-composition-src="compositions/dashboard.html"        data-start="5.6"  data-duration="8"  data-track-index="0"></div>
    <div class="scene clip" id="sc-preferences" data-composition-id="sc-preferences"   data-composition-src="compositions/job-preferences.html"  data-start="13.6" data-duration="7.5"  data-track-index="0"></div>
    <div class="scene clip" id="sc-ats" data-composition-id="sc-ats"           data-composition-src="compositions/ats-optimizer.html"    data-start="21.1" data-duration="11"  data-track-index="0"></div>
    <div class="scene clip" id="sc-recommended" data-composition-id="sc-recommended"   data-composition-src="compositions/recommended-jobs.html" data-start="32.1" data-duration="7.6"  data-track-index="0"></div>
    <div class="scene clip" id="sc-applications" data-composition-id="sc-applications"  data-composition-src="compositions/job-applications.html" data-start="39.7" data-duration="8"  data-track-index="0"></div>
    <div class="scene clip" data-composition-id="sc-stats"         data-composition-src="compositions/stats-payoff.html"     data-start="47.7" data-duration="5.5"   data-track-index="0"></div>
    <div class="scene clip" data-composition-id="sc-cta"           data-composition-src="compositions/cta.html"              data-start="53.2" data-duration="5"   data-track-index="0"></div>

    <!-- ─── Animated captions (track 2) — word-level karaoke over product scenes -->
    <div class="scene clip" data-composition-id="sc-captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="58.2" data-track-index="2"></div>

    <!-- ─── Transition wipes (track 3) — sweep spans each scene boundary -->
    <div class="wipe clip" data-layout-allow-overflow id="wipe-1" data-start="5.32" data-duration="0.56" data-track-index="3">
      <div class="wp wp-back"></div>
      <div class="wp wp-front"><div class="wipe-label"><span class="no">01</span><span class="name">Your workspace</span></div></div>
    </div>
    <div class="wipe clip" data-layout-allow-overflow id="wipe-2" data-start="13.32" data-duration="0.56" data-track-index="3">
      <div class="wp wp-back"></div>
      <div class="wp wp-front"><div class="wipe-label"><span class="no">02</span><span class="name">Preferences</span></div></div>
    </div>
    <div class="wipe clip" data-layout-allow-overflow id="wipe-3" data-start="20.82" data-duration="0.56" data-track-index="3">
      <div class="wp wp-back"></div>
      <div class="wp wp-front"><div class="wipe-label"><span class="no">03</span><span class="name">ATS Optimizer</span></div></div>
    </div>
    <div class="wipe clip" data-layout-allow-overflow id="wipe-4" data-start="31.82" data-duration="0.56" data-track-index="3">
      <div class="wp wp-back"></div>
      <div class="wp wp-front"><div class="wipe-label"><span class="no">04</span><span class="name">Recommended jobs</span></div></div>
    </div>
    <div class="wipe clip" data-layout-allow-overflow id="wipe-5" data-start="39.42" data-duration="0.56" data-track-index="3">
      <div class="wp wp-back"></div>
      <div class="wp wp-front"><div class="wipe-label"><span class="no">05</span><span class="name">Auto-apply</span></div></div>
    </div>
    <div class="wipe clip" data-layout-allow-overflow id="wipe-6" data-start="47.42" data-duration="0.56" data-track-index="3">
      <div class="wp wp-back"></div>
      <div class="wp wp-front"></div>
    </div>
    <div class="wipe clip" data-layout-allow-overflow id="wipe-7" data-start="52.92" data-duration="0.56" data-track-index="3">
      <div class="wp wp-back"></div>
      <div class="wp wp-front"></div>
    </div>

    <!-- ─── Voiceover (track 6) — Kokoro af_heart ────────────────────── -->
    <audio id="vo-01" class="clip" src="assets/vo/01-hook.wav"        data-start="0.2"  data-duration="3.3" data-track-index="6"></audio>
    <audio id="vo-02" class="clip" src="assets/vo/02-brand.wav"       data-start="3.6"  data-duration="1.9" data-track-index="6"></audio>
    <audio id="vo-03" class="clip" src="assets/vo/03-dashboard.wav"   data-start="5.9"  data-duration="7.5" data-track-index="6"></audio>
    <audio id="vo-04" class="clip" src="assets/vo/04-preferences.wav" data-start="13.9" data-duration="7.1" data-track-index="6"></audio>
    <audio id="vo-05" class="clip" src="assets/vo/05-ats.wav"         data-start="21.4" data-duration="8.4" data-track-index="6"></audio>
    <audio id="vo-06" class="clip" src="assets/vo/06-recommended.wav" data-start="32.4" data-duration="4.9" data-track-index="6"></audio>
    <audio id="vo-07" class="clip" src="assets/vo/07-extension.wav"   data-start="40.0" data-duration="6.3" data-track-index="6"></audio>
    <audio id="vo-08" class="clip" src="assets/vo/08-stats.wav"       data-start="47.9" data-duration="5.3" data-track-index="6"></audio>
    <audio id="vo-09" class="clip" src="assets/vo/09-cta.wav"         data-start="53.7" data-duration="2.1" data-track-index="6"></audio>
  </div>

  <script>
    // ─── Root timeline: drives the wipe sweeps at each scene boundary ──
    var tl = gsap.timeline({ paused: true });

    gsap.set(".wp", { xPercent: -135 });

    // Boundary = wipe data-start + 0.28 (panels fully cover at the cut).
    var boundaries = [5.6, 13.6, 21.1, 32.1, 39.7, 47.7, 53.2];
    boundaries.forEach(function (b, i) {
      var id = "#wipe-" + (i + 1);
      tl.to(id + " .wp-front", { xPercent: 135, duration: 0.56, ease: "power2.inOut" }, b - 0.28);
      tl.to(id + " .wp-back",  { xPercent: 135, duration: 0.56, ease: "power2.inOut" }, b - 0.24);
    });

    // ─── Camera: event-driven shot lists per product scene ─────────────
    // Screen-Studio grammar: move WHEN something happens (0.5-0.9s,
    // ease-in-out), HOLD while the viewer reads, pull back before the
    // wipe. Never continuous drift. Transforms live on the host divs so
    // captions (track 2) and wipes (track 3) stay fixed.
    //
    // focus(px, py, s): position UI point (px,py) at frame center, scale s.
    // Hosts use transformOrigin 0/0 so x/y math is exact.
    function focus(px, py, s) {
      // Clamp so the camera never travels past the scene edge — focusing
      // near-edge content locks the frame to that edge instead of
      // exposing the page background.
      var x = Math.max(1920 * (1 - s), Math.min(0, 960 - px * s));
      var y = Math.max(1080 * (1 - s), Math.min(0, 540 - py * s));
      return { x: x, y: y, scale: s };
    }
    function cam(sel, t, dur, px, py, s, ease) {
      tl.to(sel, Object.assign(focus(px, py, s),
        { duration: dur, ease: ease || "power2.inOut" }), t);
    }
    gsap.set("#sc-dashboard, #sc-preferences, #sc-ats, #sc-recommended, #sc-applications",
      { transformOrigin: "0% 0%" });

    // Dashboard (5.6-13.6 | hero 0.2, counters 3.2, hubs 4.6-7.3):
    gsap.set("#sc-dashboard", focus(1000, 380, 1.05));      // establish on hero
    cam("#sc-dashboard", 8.4, 0.6, 1080, 400, 1.22);        // punch: stat counters tick
    cam("#sc-dashboard", 10.4, 0.65, 1060, 700, 1.12);      // glide down: hub grids cascade
    cam("#sc-dashboard", 12.6, 0.9, 960, 540, 1.03);        // pull wide before wipe

    // Preferences (13.6-21.1 | chips 2.2-3.3, switches+salary 4.1-5.6, tab 6.5):
    gsap.set("#sc-preferences", focus(960, 420, 1.04));
    cam("#sc-preferences", 15.6, 0.55, 840, 340, 1.20);     // punch: keyword chips pop
    cam("#sc-preferences", 17.6, 0.6, 1000, 560, 1.22);     // glide: remote switch + salary tick
    cam("#sc-preferences", 20.1, 0.8, 960, 480, 1.05);      // pull back on tab switch

    // ATS (21.1-32.1 | typing 1.4-2.8, gauge 3.85, transform 8.0, climb 9.5):
    gsap.set("#sc-ats", focus(960, 480, 1.03));
    cam("#sc-ats", 22.4, 0.55, 640, 430, 1.18);             // punch: job description types in
    cam("#sc-ats", 24.4, 0.65, 1390, 360, 1.24);            // move: gauge sweeps to 89
    cam("#sc-ats", 29.1, 0.45, 1430, 540, 1.32, "power3.out"); // SNAP: keywords flip green
    cam("#sc-ats", 30.5, 0.55, 1460, 300, 1.26);            // tilt up: score climbs to 96

    // Recommended (32.1-39.7 | search 0.85-2.5, cards 2.7, hero match 5.55):
    gsap.set("#sc-recommended", focus(960, 450, 1.04));
    cam("#sc-recommended", 32.9, 0.5, 1000, 250, 1.16);     // punch: AI fills the search
    cam("#sc-recommended", 34.8, 0.6, 1040, 600, 1.07);     // pull back: cards cascade
    cam("#sc-recommended", 37.5, 0.55, 640, 500, 1.22);     // punch: 94% hero match glows

    // Applications board (39.7-47.7 | cards stream 1.3-2.3, new card 3.1,
    // drag Applied→Interviewing 4.3-5.7):
    gsap.set("#sc-applications", focus(960, 400, 1.05));
    cam("#sc-applications", 41.0, 0.6, 710, 470, 1.20);     // punch: extension cards stream into Applied
    cam("#sc-applications", 44.4, 0.8, 850, 480, 1.14);     // glide right: card drags toward Interviewing
    cam("#sc-applications", 45.5, 0.5, 970, 540, 1.18);     // settle on the drop — Interviewing 2→3
    cam("#sc-applications", 46.5, 0.9, 960, 540, 1.04);     // pull wide before wipe

    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
