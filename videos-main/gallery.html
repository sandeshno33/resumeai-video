<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume AI — Page Gallery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #08070d; color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: flex; flex-direction: column; min-height: 100vh; overflow: hidden; }

    .topbar {
      display: flex; align-items: center; gap: 16px;
      padding: 14px 24px;
      background: #0e0d18;
      border-bottom: 1px solid #1f1d2e;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding-right: 16px; border-right: 1px solid #1f1d2e; }
    .brand-mark { width: 28px; height: 28px; object-fit: contain; }
    .brand-name { font-size: 14px; color: #d4d4d8; font-weight: 400; }
    .brand-sub { font-size: 11px; color: #71717a; margin-left: 4px; }

    .tabs { display: flex; gap: 4px; flex: 1; overflow-x: auto; }
    .tab {
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      color: #a1a1aa;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid transparent;
      transition: background 120ms, color 120ms;
    }
    .tab:hover { background: #1a1828; color: #e4e4e7; }
    .tab.active {
      background: #533afd;
      color: #fff;
    }
    .tab-key { color: #71717a; font-size: 11px; margin-left: 6px; }
    .tab.active .tab-key { color: rgba(255,255,255,0.6); }

    .meta {
      font-size: 12px; color: #71717a;
      padding-left: 16px; border-left: 1px solid #1f1d2e;
    }

    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 20%, rgba(83,58,253,0.08), transparent 50%),
        radial-gradient(circle at 70% 80%, rgba(83,58,253,0.05), transparent 50%),
        #08070d;
    }

    .frame-wrap {
      width: 1920px;
      height: 1080px;
      transform-origin: center center;
      box-shadow:
        0 30px 80px rgba(0,0,0,0.6),
        0 0 0 1px rgba(255,255,255,0.06);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      position: relative;
    }
    iframe {
      width: 1920px;
      height: 1080px;
      border: 0;
      display: block;
    }

    .ribbon {
      position: absolute;
      top: 16px; left: 16px;
      padding: 6px 12px;
      background: rgba(8,7,13,0.7);
      backdrop-filter: blur(12px);
      color: #fff;
      font-size: 12px; font-weight: 500;
      border-radius: 999px;
      pointer-events: none;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <img class="brand-mark" src="assets/resumeai_logo_square.webp" alt="Resume AI" />
      <div>
        <div class="brand-name">Resume AI</div>
        <div class="brand-sub">page gallery · 1920×1080</div>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="meta" id="meta">scale: 100%</div>
  </div>
  <div class="stage" id="stage">
    <div class="frame-wrap" id="wrap">
      <div class="ribbon" id="ribbon">Candidate Dashboard</div>
      <iframe id="frame" src="compositions/dashboard.html"></iframe>
    </div>
  </div>

  <script>
    const PAGES = [
      { key: "1", id: "dashboard",         label: "Dashboard",         file: "compositions/dashboard.html" },
      { key: "2", id: "ats-optimizer",     label: "ATS Optimizer",     file: "compositions/ats-optimizer.html" },
      { key: "3", id: "recommended-jobs",  label: "Recommended Jobs",  file: "compositions/recommended-jobs.html" },
      { key: "4", id: "job-applications",  label: "Job Applications",  file: "compositions/job-applications.html" },
      { key: "5", id: "job-preferences",   label: "Job Preferences",   file: "compositions/job-preferences.html" },
      { key: "6", id: "my-resume",         label: "My Resume",         file: "compositions/my-resume.html" },
      { key: "7", id: "resumes",           label: "Resume Builder",    file: "compositions/resumes.html" },
      { key: "8", id: "browser-extension", label: "Chrome Extension",  file: "compositions/browser-extension.html" },
    ];

    const tabsEl = document.getElementById("tabs");
    const frame = document.getElementById("frame");
    const ribbon = document.getElementById("ribbon");
    const stage = document.getElementById("stage");
    const wrap = document.getElementById("wrap");
    const meta = document.getElementById("meta");

    let active = "dashboard";

    function renderTabs() {
      tabsEl.innerHTML = "";
      for (const p of PAGES) {
        const t = document.createElement("div");
        t.className = "tab" + (p.id === active ? " active" : "");
        t.innerHTML = p.label + ' <span class="tab-key">' + p.key + '</span>';
        t.onclick = () => activate(p.id);
        tabsEl.appendChild(t);
      }
    }

    function activate(id) {
      const p = PAGES.find(x => x.id === id);
      if (!p) return;
      active = id;
      frame.src = p.file;
      ribbon.textContent = p.label;
      renderTabs();
    }

    function fitFrame() {
      const sw = stage.clientWidth;
      const sh = stage.clientHeight;
      const padding = 48;
      const scale = Math.min(
        (sw - padding) / 1920,
        (sh - padding) / 1080,
      );
      wrap.style.transform = "scale(" + scale + ")";
      meta.textContent = "scale: " + Math.round(scale * 100) + "%";
    }

    window.addEventListener("resize", fitFrame);
    document.addEventListener("keydown", (e) => {
      const idx = PAGES.findIndex(p => p.key === e.key);
      if (idx >= 0) activate(PAGES[idx].id);
      if (e.key === "ArrowRight") {
        const i = PAGES.findIndex(p => p.id === active);
        activate(PAGES[(i + 1) % PAGES.length].id);
      }
      if (e.key === "ArrowLeft") {
        const i = PAGES.findIndex(p => p.id === active);
        activate(PAGES[(i - 1 + PAGES.length) % PAGES.length].id);
      }
    });

    renderTabs();
    fitFrame();
  </script>
</body>
</html>
