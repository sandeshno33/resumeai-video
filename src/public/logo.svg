<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Brand blue to cyan linear gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6efd" />
      <stop offset="100%" stop-color="#00d4ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing logo background rect -->
  <rect x="10" y="10" width="180" height="180" rx="45" fill="url(#brandGrad)" />

  <!-- White document sheet representing resume -->
  <rect x="55" y="45" width="90" height="110" rx="10" fill="none" stroke="#ffffff" stroke-width="8" />

  <!-- Document layout lines -->
  <line x1="75" y1="75" x2="125" y2="75" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <line x1="75" y1="95" x2="125" y2="95" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <line x1="75" y1="115" x2="105" y2="115" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />

  <!-- Glowing AI Sparkle/Checkmark on the bottom-right -->
  <circle cx="145" cy="135" r="24" fill="#00d4ff" filter="url(#glow)" />
  <path d="M137 135 l5 5 l10 -10" stroke="#0d253d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>